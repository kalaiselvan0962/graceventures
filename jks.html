<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirForShare — Glass Edition</title>
    <style>
         :root {
            --bg: #0a0a14;
            --glass-bg: rgba(20, 20, 35, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.04);
            --text: #e8e8f0;
            --text-muted: #9494b8;
            --accent: #8b7cf0;
            --accent-glow: rgba(139, 124, 240, 0.35);
            --accent-2: #c44dff;
            --radius: 20px;
            --radius-sm: 12px;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            --font-sans: 'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif;
            --editor-font-size: 0.95rem;
            --editor-line-height: 1.7;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        /* ── animated gradient orbs ── */
        
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 14s infinite ease-in-out;
            opacity: 0.5;
        }
        
        .bg-orb.orb-1 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(139, 124, 240, 0.5) 0%, transparent 70%);
            top: -8%;
            left: -10%;
            animation-delay: 0s;
            animation-duration: 16s;
        }
        
        .bg-orb.orb-2 {
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(196, 77, 255, 0.4) 0%, transparent 70%);
            bottom: -12%;
            right: -8%;
            animation-delay: -5s;
            animation-duration: 18s;
        }
        
        .bg-orb.orb-3 {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(100, 180, 255, 0.35) 0%, transparent 70%);
            top: 50%;
            left: 55%;
            animation-delay: -9s;
            animation-duration: 20s;
        }
        
        @keyframes floatOrb {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -40px) scale(1.1);
            }
            50% {
                transform: translate(-25px, 20px) scale(0.92);
            }
            75% {
                transform: translate(-18px, -30px) scale(1.05);
            }
        }
        
        .particle-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 36px 36px;
            animation: particleDrift 30s linear infinite;
        }
        
        @keyframes particleDrift {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 36px 36px;
            }
        }
        /* ── main container ── */
        
        .container {
            width: 100%;
            max-width: 760px;
            background: var(--glass-bg);
            backdrop-filter: blur(32px) saturate(160%);
            -webkit-backdrop-filter: blur(32px) saturate(160%);
            border-radius: 28px;
            padding: 24px 22px;
            border: 1.5px solid var(--glass-border);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 0 1px 0 rgba(255, 255, 255, 0.06) inset;
            position: relative;
            z-index: 2;
            transition: box-shadow 0.5s ease, border-color 0.5s ease;
            animation: containerAppear 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }
        
        @keyframes containerAppear {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .container:hover {
            border-color: rgba(255, 255, 255, 0.14);
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05) inset, 0 0 60px -15px var(--accent-glow);
        }
        /* ── header ── */
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .logo {
            font-weight: 800;
            font-size: 1.45rem;
            letter-spacing: -0.02em;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .logo span {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        
        .logo-icon {
            display: inline-block;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            margin-right: 2px;
            animation: logoPulse 3s infinite ease-in-out;
            box-shadow: 0 0 18px var(--accent-glow);
            flex-shrink: 0;
        }
        
        @keyframes logoPulse {
            0%,
            100% {
                box-shadow: 0 0 18px var(--accent-glow);
            }
            50% {
                box-shadow: 0 0 32px rgba(196, 77, 255, 0.55);
            }
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .status {
            background: rgba(255, 255, 255, 0.05);
            padding: 7px 14px;
            border-radius: 24px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 7px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.35s ease;
            white-space: nowrap;
        }
        
        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #e74c3c;
            box-shadow: 0 0 10px #e74c3c;
            transition: all 0.4s ease;
            flex-shrink: 0;
        }
        
        .dot.connected {
            background: #00e676;
            box-shadow: 0 0 14px #00e676;
            animation: dotGlow 2s infinite ease-in-out;
        }
        
        .dot.syncing {
            background: #ffb74d;
            box-shadow: 0 0 16px #ffb74d;
            animation: syncPulse 0.5s infinite ease-in-out;
        }
        
        @keyframes dotGlow {
            0%,
            100% {
                box-shadow: 0 0 10px #00e676;
            }
            50% {
                box-shadow: 0 0 22px #00e676, 0 0 40px rgba(0, 230, 118, 0.35);
            }
        }
        
        @keyframes syncPulse {
            0%,
            100% {
                box-shadow: 0 0 10px #ffb74d;
            }
            50% {
                box-shadow: 0 0 28px #ff9800, 0 0 44px rgba(255, 152, 0, 0.5);
            }
        }
        
        .peer-badge {
            background: rgba(139, 124, 240, 0.15);
            border: 1px solid rgba(139, 124, 240, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #c4b5fd;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: all 0.3s ease;
            animation: badgePopIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes badgePopIn {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .peer-badge.pulse {
            animation: badgePulse 0.6s ease-in-out;
        }
        
        @keyframes badgePulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
                border-color: rgba(196, 77, 255, 0.7);
            }
        }
        /* ── info row ── */
        
        .info-row {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: border-color 0.3s;
        }
        
        .info-row:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }
        
        .info-row code {
            background: rgba(0, 0, 0, 0.35);
            padding: 3px 10px;
            border-radius: 6px;
            color: #c4b5fd;
            user-select: all;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.73rem;
            letter-spacing: 0.02em;
            transition: background 0.2s;
        }
        
        .info-row code:hover {
            background: rgba(0, 0, 0, 0.5);
        }
        
        .info-row .sep {
            color: rgba(255, 255, 255, 0.2);
            margin: 0 2px;
        }
        
        .last-updated {
            font-size: 0.7rem;
            color: var(--text-muted);
            opacity: 0.8;
            font-style: italic;
            white-space: nowrap;
        }
        /* ── toolbar ── */
        
        .toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            align-items: center;
        }
        
        .tool-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 6px 11px;
            border-radius: 18px;
            font-size: 0.73rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: var(--font-sans);
            font-weight: 500;
            white-space: nowrap;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.01em;
            user-select: none;
        }
        
        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            color: #d0d0e8;
            transform: translateY(-1px);
        }
        
        .tool-btn:active {
            transform: scale(0.94);
            transition: transform 0.1s ease;
        }
        
        .tool-btn.active {
            background: rgba(139, 124, 240, 0.15);
            border-color: rgba(139, 124, 240, 0.45);
            color: #c4b5fd;
            box-shadow: 0 0 14px rgba(139, 124, 240, 0.2);
        }
        
        .tool-btn.font-btn {
            font-family: var(--font-mono);
            font-weight: 700;
            padding: 6px 10px;
            min-width: 28px;
            justify-content: center;
        }
        
        .toolbar .spacer {
            flex: 1;
            min-width: 8px;
        }
        /* ── editor container ── */
        
        .editor-wrapper {
            position: relative;
            margin-bottom: 6px;
        }
        
        .editor-container {
            display: flex;
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        
        .editor-container:focus-within {
            box-shadow: 0 0 0 6px rgba(139, 124, 240, 0.06), 0 0 30px -8px var(--accent-glow);
        }
        
        .editor-container.remote-pulse {
            animation: remoteGlow 0.7s ease-out;
        }
        
        @keyframes remoteGlow {
            0% {
                box-shadow: 0 0 0 0 rgba(100, 180, 255, 0.5), 0 0 0 0 rgba(100, 180, 255, 0.3);
            }
            60% {
                box-shadow: 0 0 0 12px rgba(100, 180, 255, 0.15), 0 0 40px -4px rgba(100, 180, 255, 0.4);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(100, 180, 255, 0), 0 0 0 0 rgba(100, 180, 255, 0);
            }
        }
        
        .line-numbers {
            font-family: var(--font-mono);
            font-size: var(--editor-font-size);
            line-height: var(--editor-line-height);
            padding: 18px 8px 18px 12px;
            text-align: right;
            user-select: none;
            color: rgba(148, 148, 184, 0.5);
            background: rgba(8, 8, 16, 0.45);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            white-space: pre;
            min-width: 36px;
            letter-spacing: 0.01em;
            transition: all 0.3s ease;
            display: none;
        }
        
        .line-numbers.visible {
            display: block;
        }
        
        .line-numbers span {
            display: block;
            line-height: var(--editor-line-height);
            font-size: var(--editor-font-size);
        }
        
        textarea {
            flex: 1;
            width: 100%;
            height: 280px;
            background: rgba(10, 10, 20, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 0;
            padding: 18px 20px;
            color: #f0f0f8;
            font-size: var(--editor-font-size);
            font-family: var(--font-mono);
            line-height: var(--editor-line-height);
            resize: vertical;
            outline: none;
            transition: all 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            letter-spacing: 0.01em;
            position: relative;
            z-index: 1;
            border-radius: var(--radius);
        }
        
        .editor-container.has-line-numbers textarea {
            border-radius: 0 var(--radius) var(--radius) 0;
            border-left: none;
        }
        
        .editor-container.has-line-numbers .line-numbers {
            border-radius: var(--radius) 0 0 var(--radius);
        }
        
        textarea::placeholder {
            color: rgba(200, 200, 220, 0.3);
            font-style: italic;
        }
        
        textarea:focus {
            border-color: rgba(139, 124, 240, 0.5);
            box-shadow: none;
            background: rgba(14, 14, 28, 0.6);
        }
        
        .editor-container:focus-within textarea {
            border-color: rgba(139, 124, 240, 0.5);
            background: rgba(14, 14, 28, 0.6);
        }
        /* ── preview pane ── */
        
        .preview-pane {
            display: none;
            width: 100%;
            min-height: 280px;
            max-height: 500px;
            overflow-y: auto;
            background: rgba(10, 10, 20, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 20px 24px;
            color: #e0e0ee;
            font-family: var(--font-sans);
            line-height: 1.75;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            letter-spacing: 0.01em;
            transition: all 0.35s ease;
        }
        
        .preview-pane.visible {
            display: block;
            animation: previewFadeIn 0.35s ease;
        }
        
        @keyframes previewFadeIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .preview-pane h1,
        .preview-pane h2,
        .preview-pane h3,
        .preview-pane h4 {
            color: #fff;
            margin: 0.8em 0 0.4em;
            font-weight: 700;
        }
        
        .preview-pane h1 {
            font-size: 1.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 0.3em;
        }
        
        .preview-pane h2 {
            font-size: 1.3rem;
        }
        
        .preview-pane h3 {
            font-size: 1.1rem;
        }
        
        .preview-pane h4 {
            font-size: 1rem;
            color: #d0d0e8;
        }
        
        .preview-pane p {
            margin: 0.5em 0;
        }
        
        .preview-pane code {
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 7px;
            border-radius: 5px;
            font-family: var(--font-mono);
            font-size: 0.85em;
            color: #f0c060;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .preview-pane pre {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 14px 18px;
            overflow-x: auto;
            margin: 0.6em 0;
            font-family: var(--font-mono);
            font-size: 0.85em;
            line-height: 1.6;
        }
        
        .preview-pane pre code {
            background: none;
            border: none;
            padding: 0;
            color: #d4d4e8;
            font-size: inherit;
        }
        
        .preview-pane blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 16px;
            margin: 0.6em 0;
            color: #b0b0cc;
            font-style: italic;
        }
        
        .preview-pane ul,
        .preview-pane ol {
            padding-left: 1.6em;
            margin: 0.4em 0;
        }
        
        .preview-pane li {
            margin: 0.2em 0;
        }
        
        .preview-pane a {
            color: #b4a0ff;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        
        .preview-pane hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            margin: 1em 0;
        }
        
        .preview-pane img {
            max-width: 100%;
            border-radius: 8px;
            margin: 0.4em 0;
        }
        /* ── stats bar ── */
        
        .stats-bar {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: var(--text-muted);
            padding: 6px 4px;
            margin-bottom: 4px;
            letter-spacing: 0.02em;
            opacity: 0.75;
            transition: opacity 0.3s;
        }
        
        .stats-bar:hover {
            opacity: 1;
        }
        
        .stats-bar .stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .stats-bar .stat-val {
            color: #c0c0d8;
            font-weight: 600;
        }
        /* ── buttons ── */
        
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 26px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
            font-family: var(--font-sans);
            font-size: 0.82rem;
            letter-spacing: 0.01em;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }
        
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 26px;
            opacity: 0;
            transition: opacity 0.3s;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .btn:active::after {
            opacity: 1;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #7a5de8);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 6px 24px rgba(108, 92, 231, 0.3);
            font-weight: 700;
        }
        
        .btn-primary:hover {
            box-shadow: 0 10px 32px rgba(108, 92, 231, 0.45);
            transform: translateY(-2px);
            filter: brightness(1.08);
        }
        
        .btn-outline {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            color: var(--text);
            font-weight: 500;
        }
        
        .btn-outline:hover {
            border-color: rgba(139, 124, 240, 0.5);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
            transform: translateY(-1px);
        }
        
        .btn-outline.btn-sm {
            padding: 5px 14px;
            font-size: 0.72rem;
            border-radius: 20px;
        }
        
        .btn-export {
            background: rgba(100, 180, 255, 0.08);
            border: 1px solid rgba(100, 180, 255, 0.2);
            color: #b0d0f8;
        }
        
        .btn-export:hover {
            border-color: rgba(100, 180, 255, 0.45);
            background: rgba(100, 180, 255, 0.14);
            box-shadow: 0 0 20px rgba(100, 180, 255, 0.2);
        }
        /* ── shortcuts modal ── */
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-panel {
            background: rgba(24, 24, 42, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px 28px;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: modalSlideIn 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        
        @keyframes modalSlideIn {
            0% {
                transform: translateY(20px) scale(0.95);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        
        .modal-panel h3 {
            color: #fff;
            margin-bottom: 14px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.01em;

        .modal-panel .shortcut-row {
            display: flex;
            justify-content: space-between;

            padding: 7px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);

        .modal-panel .shortcut-row:last-child {

        .modal-panel .shortcut-keys {
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 10px;

        .modal-close {
            float: right;
            background: none;

            color: #888;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0 0 8px 8px;
            line-height: 1;
            transition: color 0.2s;
        }
        
        .modal-close:hover {
            color: #fff;
        }
        /* ── toast ── */
        
        .toast-temp {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30, 30, 45, 0.9);
            backdrop-filter: blur(20px);

            font-size: 0.83rem;
            font-weight: 500;
            z-index: 99;
            pointer-events: none;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.01em;
        }
        
        .toast-temp.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .toast-temp.toast-success {
            border-color: rgba(0, 230, 118, 0.4);
            box-shadow: 0 8px 30px rgba(0, 230, 118, 0.2);
        }
        
        .toast-temp.toast-error {
            border-color: rgba(255, 82, 82, 0.4);
            box-shadow: 0 8px 30px rgba(255, 82, 82, 0.2);
        }
        /* ── responsive ── */
        
        @media (max-width: 600px) {
            .container {
                padding: 18px 12px;

            .header {
                gap: 6px;
            }
            .logo {

            }
            .header-right {

            textarea {

<body>

    <div class="bg-orb orb-1"></div>

    <div class="bg-orb orb-3"></div>
    <div class="particle-layer"></div>

    <!-- toast -->
    <div class="toast-temp" id="toast"></div>

    <!-- shortcuts modal -->
    <div class="modal-overlay" id="shortcutsModal">
        <div class="modal-panel">
            <button class="modal-close" id="modalCloseBtn" aria-label="Close shortcuts">&times;</button>
            <h3>⌨️ Keyboard Shortcuts</h3>
            <div class="shortcut-row"><span class="shortcut-desc">Toggle Preview</span><span class="shortcut-keys">Ctrl+Shift+P</span></div>
            <div class="shortcut-row"><span class="shortcut-desc">Toggle Line Numbers</span><span class="shortcut-keys">Ctrl+Shift+L</span></div>
            <div class="shortcut-row"><span class="shortcut-desc">Copy All Text</span><span class="shortcut-keys">Ctrl+Shift+C</span></div>
            <div class="shortcut-row"><span class="shortcut-desc">Export as .txt</span><span class="shortcut-keys">Ctrl+Shift+E</span></div>
            <div class="shortcut-row"><span class="shortcut-desc">Show Shortcuts</span><span class="shortcut-keys">?</span></div>
            <div class="shortcut-row"><span class="shortcut-desc">Close Modal / Preview</span><span class="shortcut-keys">Esc</span></div>

    <!-- main container -->
    <div class="container">
        <div class="header">

                <span class="logo-icon"></span> Air<span>ForShare</span>
            </div>
            <div class="header-right">
                <div class="peer-badge" id="peerBadge" title="Connected peers">👥 <span id="peerCount">1</span></div>
                <div class="status">
                    <span class="dot" id="statusDot"></span>
                    <span id="statusText">Connecting…</span>
                </div>
            </div>
        </div>

        <div class="info-row">
            🔗 Session: <code id="sessionIdDisplay">…</code>
            <button class="btn-outline btn-sm" id="copyLinkBtn">📎 Copy link</button>
            <span class="sep">|</span>
            <span class="last-updated" id="lastUpdatedLabel">—</span>
        </div>

        <!-- toolbar -->
        <div class="toolbar" id="toolbar">
            <button class="tool-btn font-btn" id="fontSizeDown" title="Decrease font size" aria-label="Decrease font size">A−</button>
            <button class="tool-btn font-btn" id="fontSizeUp" title="Increase font size" aria-label="Increase font size">A+</button>
            <button class="tool-btn" id="toggleLineNumbers" title="Toggle line numbers">🔢 Lines</button>
            <button class="tool-btn" id="togglePreview" title="Toggle markdown preview">👁️ Preview</button>
            <span class="spacer"></span>
            <button class="tool-btn" id="exportBtn" title="Export as .txt file">💾 Export</button>

        </div>

        <!-- stats bar -->
        <div class="stats-bar" id="statsBar">
            <span class="stat">📝 Words: <span class="stat-val" id="wordCount">0</span></span>
            <span class="stat">🔤 Chars: <span class="stat-val" id="charCount">0</span></span>
            <span class="stat">⏱️ Read: <span class="stat-val" id="readingTime">1 min</span></span>
        </div>

        <!-- editor area -->
        <div class="editor-wrapper">
            <div class="editor-container" id="editorContainer">
                <div class="line-numbers" id="lineNumbers"></div>
                <textarea id="sharedTextarea" placeholder="Start typing — it syncs live ✨" aria-label="Shared text editor"></textarea>

        <div class="buttons">

            <button class="btn-export btn-outline" id="exportMainBtn">💾 Export .txt</button>
            <button class="btn-primary" id="newSessionBtn">🔄 New session</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
    </script>

    <script>
        (function() {
            // ═══════════════════════════════════════
            // Toast helper
            // ═══════════════════════════════════════
            const toastEl = document.getElementById('toast');
            let toastTimer;

            function showToast(msg, type = '') {
                if (toastTimer) clearTimeout(toastTimer);
                toastEl.textContent = msg;
                toastEl.className = 'toast-temp show';
                if (type) toastEl.classList.add('toast-' + type);
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('show', 'toast-success', 'toast-error');
                }, 2000);
            }

            // ═══════════════════════════════════════
            // Firebase config & init
            // ═══════════════════════════════════════
            const firebaseConfig = {
                apiKey: "AIzaSyACGCVwSYv62Pyjxo7UKcgdxLq3FJVv4lA",
                authDomain: "taskflow-planner-2334d.firebaseapp.com",
                databaseURL: "https://taskflow-planner-2334d-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "taskflow-planner-2334d",
                storageBucket: "taskflow-planner-2334d.firebasestorage.app",
                messagingSenderId: "397910412033",
                appId: "1:397910412033:web:29ccabf522a9d620832900",
                measurementId: "G-CL9BS9HF51"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            // ═══════════════════════════════════════
            // Session management
            // ═══════════════════════════════════════
            function getSessionId() {
                const params = new URLSearchParams(window.location.search);
                let sid = params.get('session');
                if (!sid) {
                    sid = generateId();
                    const url = new URL(window.location);
                    url.searchParams.set('session', sid);
                    window.history.replaceState({}, '', url);
                }
                return sid;
            }

            function generateId() {
                return Math.random().toString(36).substring(2, 10);
            }

            const SESSION_ID = getSessionId();
            document.getElementById('sessionIdDisplay').textContent = SESSION_ID;
            const shareUrl = `${window.location.origin}${window.location.pathname}?session=${SESSION_ID}`;

            // ═══════════════════════════════════════
            // DOM element references
            // ═══════════════════════════════════════
            const textarea = document.getElementById('sharedTextarea');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const copyLinkBtn = document.getElementById('copyLinkBtn');
            const editorContainer = document.getElementById('editorContainer');
            const lineNumbersEl = document.getElementById('lineNumbers');
            const previewPane = document.getElementById('previewPane');
            const peerBadge = document.getElementById('peerBadge');
            const peerCountEl = document.getElementById('peerCount');
            const lastUpdatedLabel = document.getElementById('lastUpdatedLabel');
            const wordCountEl = document.getElementById('wordCount');
            const charCountEl = document.getElementById('charCount');
            const readingTimeEl = document.getElementById('readingTime');
            const shortcutsModal = document.getElementById('shortcutsModal');
            const modalCloseBtn = document.getElementById('modalCloseBtn');

            // ═══════════════════════════════════════
            // State
            // ═══════════════════════════════════════
            let isUpdatingFromFirebase = false;
            let isPreviewMode = false;
            let lineNumbersVisible = false;
            let isConnected = false;
            let lastRemoteUpdate = null;
            let peerCount = 1;
            const CLIENT_ID = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15));
            const FONT_SIZES = ['0.8rem', '0.9rem', '0.95rem', '1.05rem', '1.15rem', '1.3rem'];
            let currentFontSizeIndex = 2; // default: 0.95rem
            let debounceTimer;
            let lastUpdatedInterval;

            // ═══════════════════════════════════════
            // Firebase references
            // ═══════════════════════════════════════
            const textRef = db.ref(`sessions/${SESSION_ID}/text`);
            const presenceRef = db.ref(`sessions/${SESSION_ID}/presence`);
            const myPresenceRef = presenceRef.child(CLIENT_ID);
            const connectedRef = db.ref('.info/connected');

            // ═══════════════════════════════════════
            // Presence system
            // ═══════════════════════════════════════
            function setupPresence() {
                myPresenceRef.onDisconnect().remove();

                connectedRef.on('value', (snap) => {
                    const connected = snap.val() === true;
                    isConnected = connected;
                    if (connected) {
                        myPresenceRef.set({
                            timestamp: firebase.database.ServerValue.TIMESTAMP,
                        });
                        statusDot.classList.add('connected');
                        statusDot.classList.remove('syncing');
                        statusText.textContent = 'Connected';
                    } else {
                        statusDot.classList.remove('connected', 'syncing');
                        statusText.textContent = 'Disconnected';
                    }
                });

                // Periodic presence refresh
                setInterval(() => {
                    if (isConnected) {
                        myPresenceRef.update({
                            timestamp: firebase.database.ServerValue.TIMESTAMP,
                        });
                    }
                }, 45000);

                // Listen to all peers
                presenceRef.on('value', (snap) => {
                    const data = snap.val() || {};
                    const now = Date.now();
                    let count = 0;
                    for (const key in data) {
                        if (data[key] && data[key].timestamp) {
                            const age = now - data[key].timestamp;
                            if (age < 120000) count++; // 2-minute threshold
                        }
                    }
                    const prevCount = peerCount;
                    peerCount = Math.max(1, count);
                    peerCountEl.textContent = peerCount;
                    if (peerCount !== prevCount && peerCount > prevCount) {
                        peerBadge.classList.remove('pulse');
                        void peerBadge.offsetWidth;
                        peerBadge.classList.add('pulse');
                    }
                });
            }

            // ═══════════════════════════════════════
            // Text sync
            // ═══════════════════════════════════════
            textRef.on('value', (snapshot) => {
                const text = snapshot.val() || '';
                if (!isUpdatingFromFirebase) {
                    textarea.value = text;
                    lastRemoteUpdate = Date.now();
                    updateLastUpdatedLabel();
                    updateLineNumbers();
                    updateStats();
                    if (isPreviewMode) renderPreview();
                    // Pulse animation on remote change
                    if (document.activeElement !== textarea) {
                        editorContainer.classList.add('remote-pulse');
                        setTimeout(() => editorContainer.classList.remove('remote-pulse'), 700);
                    }
                }
            });

            textarea.addEventListener('input', () => {
                const text = textarea.value;
                updateLineNumbers();
                updateStats();
                if (isPreviewMode) renderPreview();
                clearTimeout(debounceTimer);
                statusDot.classList.add('syncing');
                statusDot.classList.remove('connected');
                debounceTimer = setTimeout(() => {
                    isUpdatingFromFirebase = true;
                    textRef.set(text).then(() => {
                        isUpdatingFromFirebase = false;
                        if (isConnected) {
                            statusDot.classList.add('connected');
                            statusDot.classList.remove('syncing');
                        }
                        updateLastUpdatedLabel();
                    }).catch(() => {
                        isUpdatingFromFirebase = false;
                        statusDot.classList.remove('syncing');
                        if (isConnected) statusDot.classList.add('connected');
                    });
                }, 250);
            });

            // Sync scroll between textarea and line numbers
            textarea.addEventListener('scroll', () => {
                if (lineNumbersVisible) {
                    lineNumbersEl.scrollTop = textarea.scrollTop;
                }
            });

            // ═══════════════════════════════════════
            // Line numbers
            // ═══════════════════════════════════════
            function updateLineNumbers() {
                if (!lineNumbersVisible) return;
                const lines = textarea.value.split('\n');
                const count = Math.max(lines.length, 1);
                const currentCount = lineNumbersEl.children.length;
                if (currentCount !== count) {
                    let html = '';
                    for (let i = 1; i <= count; i++) {
                        html += `<span>${i}</span>`;
                    }
                    lineNumbersEl.innerHTML = html;
                }
                lineNumbersEl.scrollTop = textarea.scrollTop;
            }

            function setLineNumbersVisible(visible) {
                lineNumbersVisible = visible;
                if (visible && !isPreviewMode) {
                    lineNumbersEl.classList.add('visible');
                    editorContainer.classList.add('has-line-numbers');
                    updateLineNumbers();
                } else {
                    lineNumbersEl.classList.remove('visible');
                    editorContainer.classList.remove('has-line-numbers');
                }
            }

            // ═══════════════════════════════════════
            // Stats
            // ═══════════════════════════════════════
            function updateStats() {
                const text = textarea.value;
                const charCount = text.length;
                const wordCount = text.trim() ? text.trim().split(/\s+/).filter(Boolean).length : 0;
                const readTime = Math.max(1, Math.ceil(wordCount / 200));
                wordCountEl.textContent = wordCount;
                charCountEl.textContent = charCount;
                readingTimeEl.textContent = readTime + ' min';
            }

            function updateLastUpdatedLabel() {
                if (lastRemoteUpdate) {
                    lastUpdatedLabel.textContent = 'Updated ' + timeAgo(lastRemoteUpdate);
                } else {
                    lastUpdatedLabel.textContent = '—';
                }
            }

            function timeAgo(timestamp) {
                const seconds = Math.floor((Date.now() - timestamp) / 1000);
                if (seconds < 3) return 'just now';
                if (seconds < 60) return seconds + 's ago';
                const minutes = Math.floor(seconds / 60);
                if (minutes < 60) return minutes + 'm ago';
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return hours + 'h ago';
                const days = Math.floor(hours / 24);
                return days + 'd ago';
            }

            // Update relative time every 20 seconds
            lastUpdatedInterval = setInterval(updateLastUpdatedLabel, 20000);

            // ═══════════════════════════════════════
            // Markdown preview
            // ═══════════════════════════════════════
            function parseMarkdown(text) {
                let html = text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');

                // Code blocks (fenced)
                const codeBlocks = [];
                html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
                    const idx = codeBlocks.length;
                    codeBlocks.push(
                        `<pre><code class="language-${lang}">${code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`
                    );
                    return `%%CODEBLOCK_${idx}%%`;
                });

                // Inline code
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

                // Images before links
                html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,
                    '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;" loading="lazy">');

                // Links
                html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
                    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

                // Headers
                html = html.replace(/^###### (.+)$/gm, '<h6>$1</h6>');
                html = html.replace(/^##### (.+)$/gm, '<h5>$1</h5>');
                html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
                html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
                html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
                html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

                // Bold + italic combos
                html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
                html = html.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
                html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
                html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
                html = html.replace(/_(.+?)_/g, '<em>$1</em>');

                // Horizontal rules
                html = html.replace(/^(---|\*\*\*|___)\s*$/gm, '<hr>');

                // Blockquotes
                html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
                html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

                // Unordered lists
                html = html.replace(/^[\-\*\+] (.+)$/gm, '<li>$1</li>');
                // Ordered lists
                html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

                // Wrap consecutive <li> in <ul>
                html = html.replace(/((?:<li>.*?<\/li>\s*)+)/g, (match) => {
                    // Check if any item starts with a number pattern (ordered list)
                    return '<ul>' + match + '</ul>';
                });

                // Paragraphs
                html = html.replace(/\n\n+/g, '</p><p>');
                html = '<p>' + html + '</p>';

                // Clean up
                html = html.replace(/<p><\/p>/g, '');
                html = html.replace(/<p>(\s*<h[1-6])/g, '$1');
                html = html.replace(/(<\/h[1-6]>)\s*<\/p>/g, '$1');
                html = html.replace(/<p>(\s*<hr\s*\/?>\s*)<\/p>/g, '<hr>');
                html = html.replace(/<p>(\s*<ul>)/g, '$1');
                html = html.replace(/(<\/ul>)\s*<\/p>/g, '$1');
                html = html.replace(/<p>(\s*<blockquote>)/g, '$1');
                html = html.replace(/(<\/blockquote>)\s*<\/p>/g, '$1');
                html = html.replace(/<p>(\s*<pre>)/g, '$1');
                html = html.replace(/(<\/pre>)\s*<\/p>/g, '$1');

                // Restore code blocks
                html = html.replace(/%%CODEBLOCK_(\d+)%%/g, (_, idx) => codeBlocks[parseInt(idx)] || '');

                return html;
            }

            function renderPreview() {
                const text = textarea.value;
                if (text.trim()) {
                    previewPane.innerHTML = parseMarkdown(text);
                } else {
                    previewPane.innerHTML =
                        '<p style="color:rgba(200,200,220,0.3);font-style:italic;">Nothing to preview yet ✨</p>';
                }
            }

            function setPreviewMode(enabled) {
                isPreviewMode = enabled;
                const toggleBtn = document.getElementById('togglePreview');
                if (enabled) {
                    textarea.style.display = 'none';
                    previewPane.classList.add('visible');
                    setLineNumbersVisible(false);
                    toggleBtn.classList.add('active');
                    toggleBtn.innerHTML = '✏️ Edit';
                    renderPreview();
                } else {
                    textarea.style.display = '';
                    previewPane.classList.remove('visible');
                    toggleBtn.classList.remove('active');
                    toggleBtn.innerHTML = '👁️ Preview';
                    // Restore line numbers if they were on
                    if (lineNumbersVisible || document.getElementById('toggleLineNumbers').classList.contains(
                            'active')) {
                        setLineNumbersVisible(true);
                    }
                }
            }

            // ═══════════════════════════════════════
            // Font size
            // ═══════════════════════════════════════
            function setFontSize(index) {
                currentFontSizeIndex = Math.max(0, Math.min(FONT_SIZES.length - 1, index));
                const size = FONT_SIZES[currentFontSizeIndex];
                document.documentElement.style.setProperty('--editor-font-size', size);
                textarea.style.fontSize = size;
                lineNumbersEl.style.fontSize = size;
                // Update line number spans
                const spans = lineNumbersEl.querySelectorAll('span');
                spans.forEach(s => s.style.fontSize = size);
                updateLineNumbers();
            }

            // ═══════════════════════════════════════
            // Export
            // ═══════════════════════════════════════
            function exportAsFile() {
                const text = textarea.value;
                const filename = `airforshare-${SESSION_ID}-${Date.now()}.txt`;
                const blob = new Blob([text], {
                    type: 'text/plain;charset=utf-8'
                });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('💾 Exported as ' + filename, 'success');
            }

            // ═══════════════════════════════════════
            // Shortcuts modal
            // ═══════════════════════════════════════
            function openShortcutsModal() {
                shortcutsModal.classList.add('open');
            }

            function closeShortcutsModal() {
                shortcutsModal.classList.remove('open');
            }

            // ═══════════════════════════════════════
            // Button handlers
            // ═══════════════════════════════════════
            document.getElementById('clearBtn').addEventListener('click', () => {
                if (confirm('Clear text for all peers in this session?')) {
                    textRef.set('');
                    textarea.value = '';
                    updateLineNumbers();
                    updateStats();
                    if (isPreviewMode) renderPreview();
                    showToast('✨ Text cleared for everyone');
                }
            });

            document.getElementById('copyTextBtn').addEventListener('click', () => {
                const text = textarea.value;
                if (text.trim()) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('📋 Text copied to clipboard', 'success');
                    }).catch(() => {
                        showToast('⚠️ Failed to copy', 'error');
                    });
                } else {
                    showToast('📝 Nothing to copy yet');
                }
            });

            document.getElementById('newSessionBtn').addEventListener('click', () => {
                const newId = generateId();
                window.location.href = `${window.location.pathname}?session=${newId}`;
            });

            copyLinkBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast('🔗 Session link copied!', 'success');
                }).catch(() => {
                    showToast('⚠️ Failed to copy link', 'error');
                });
            });

            document.getElementById('toggleLineNumbers').addEventListener('click', function() {
                const currentlyVisible = lineNumbersVisible;
                setLineNumbersVisible(!currentlyVisible);
                if (lineNumbersVisible) {
                    this.classList.add('active');
                } else {
                    this.classList.remove('active');
                }
            });

            document.getElementById('togglePreview').addEventListener('click', function() {
                setPreviewMode(!isPreviewMode);
            });

            document.getElementById('exportBtn').addEventListener('click', exportAsFile);
            document.getElementById('exportMainBtn').addEventListener('click', exportAsFile);

            document.getElementById('fontSizeUp').addEventListener('click', () => {
                setFontSize(currentFontSizeIndex + 1);
                showToast('🔤 Font size: ' + FONT_SIZES[currentFontSizeIndex]);
            });

            document.getElementById('fontSizeDown').addEventListener('click', () => {
                setFontSize(currentFontSizeIndex - 1);
                showToast('🔤 Font size: ' + FONT_SIZES[currentFontSizeIndex]);
            });

            document.getElementById('shortcutsHintBtn').addEventListener('click', openShortcutsModal);
            modalCloseBtn.addEventListener('click', closeShortcutsModal);
            shortcutsModal.addEventListener('click', (e) => {
                if (e.target === shortcutsModal) closeShortcutsModal();
            });

            // ═══════════════════════════════════════
            // Keyboard shortcuts
            // ═══════════════════════════════════════
            document.addEventListener('keydown', (e) => {
                // Don't intercept when typing in textarea (except for special combos)
                const isInTextarea = document.activeElement === textarea;

                // Ctrl+Shift+C — Copy all text
                if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                    e.preventDefault();
                    document.getElementById('copyTextBtn').click();
                    return;
                }

                // Ctrl+Shift+P — Toggle preview
                if (e.ctrlKey && e.shiftKey && e.key === 'P') {
                    e.preventDefault();
                    setPreviewMode(!isPreviewMode);
                    return;
                }

                // Ctrl+Shift+L — Toggle line numbers
                if (e.ctrlKey && e.shiftKey && e.key === 'L') {
                    e.preventDefault();
                    document.getElementById('toggleLineNumbers').click();
                    return;
                }

                // Ctrl+Shift+E — Export
                if (e.ctrlKey && e.shiftKey && e.key === 'E') {
                    e.preventDefault();
                    exportAsFile();
                    return;
                }

                // ? — Show shortcuts (only when not in textarea or with Ctrl)
                if (e.key === '?' && !isInTextarea) {
                    e.preventDefault();
                    openShortcutsModal();
                    return;
                }
                if (e.ctrlKey && e.key === '/') {
                    e.preventDefault();
                    openShortcutsModal();
                    return;
                }

                // Escape — Close preview or modal
                if (e.key === 'Escape') {
                    if (shortcutsModal.classList.contains('open')) {
                        closeShortcutsModal();
                        return;
                    }
                    if (isPreviewMode) {
                        setPreviewMode(false);
                        return;
                    }
                }
            });

            // ═══════════════════════════════════════
            // Initialization
            // ═══════════════════════════════════════
            function init() {
                setupPresence();
                updateStats();
                updateLineNumbers();
                setFontSize(currentFontSizeIndex);
                updateLastUpdatedLabel();

                // Initial sync indicator
                setTimeout(() => {
                    if (isConnected && !lastRemoteUpdate) {
                        lastRemoteUpdate = Date.now();
                        updateLastUpdatedLabel();
                    }
                }, 2000);
            }

            init();

            // ═══════════════════════════════════════
            // Cleanup on page unload
            // ═══════════════════════════════════════
            window.addEventListener('beforeunload', () => {
                myPresenceRef.remove();
                if (lastUpdatedInterval) clearInterval(lastUpdatedInterval);
            });

            console.log('%c🚀 AirForShare Glass Edition %cready',
                'color:#c4b5fd;font-size:1.2em;', 'color:#aaa;');
            console.log('%cSession:%c ' + SESSION_ID,
                'color:#888;', 'color:#c4b5fd;font-weight:bold;');
            console.log('%cShare link:%c ' + shareUrl,
                'color:#888;', 'color:#8b7cf0;');
            console.log('%cPress ? for keyboard shortcuts',
                'color:#666;font-style:italic;');
        })();
    </script>
</body>

</html>
