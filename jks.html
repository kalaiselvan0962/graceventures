<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J K S H A R E</title>
    <!-- LottieFiles Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        :root {
            --bg: #0a0a14;
            --glass-bg: rgba(20, 20, 35, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.04);
            --text: #e8e8f0;
            --text-muted: #9494b8;
            --accent: #8b7cf0;
            --accent-glow: rgba(139, 124, 240, 0.35);
            --accent-2: #c44dff;
            --radius: 20px;
            --radius-sm: 12px;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            --font-sans: 'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Lottie background layer ── */
        .lottie-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.18;
            pointer-events: none;
            mix-blend-mode: screen;
        }
        .lottie-bg lottie-player {
            width: 100%;
            height: 100%;
        }

        /* animated gradient orbs (still keep as subtle complement) */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 14s infinite ease-in-out;
            opacity: 0.25;
        }
        .bg-orb.orb-1 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(139, 124, 240, 0.4) 0%, transparent 70%);
            top: -8%;
            left: -10%;
            animation-delay: 0s;
            animation-duration: 16s;
        }
        .bg-orb.orb-2 {
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(196, 77, 255, 0.3) 0%, transparent 70%);
            bottom: -12%;
            right: -8%;
            animation-delay: -5s;
            animation-duration: 18s;
        }

        @keyframes floatOrb {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -40px) scale(1.1);
            }
            50% {
                transform: translate(-25px, 20px) scale(0.92);
            }
            75% {
                transform: translate(-18px, -30px) scale(1.05);
            }
        }

        /* ── main container ── */
        .container {
            width: 100%;
            max-width: 720px;
            background: var(--glass-bg);
            backdrop-filter: blur(32px) saturate(160%);
            -webkit-backdrop-filter: blur(32px) saturate(160%);
            border-radius: 28px;
            padding: 28px 24px;
            border: 1.5px solid var(--glass-border);
            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 1px 0 rgba(255, 255, 255, 0.06) inset;
            position: relative;
            z-index: 2;
            transition: box-shadow 0.5s ease, border-color 0.5s ease;
            animation: containerAppear 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }
        @keyframes containerAppear {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .container:hover {
            border-color: rgba(255, 255, 255, 0.14);
            box-shadow:
                0 12px 50px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 0 60px -15px var(--accent-glow);
        }

        /* ── header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo span {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        /* Lottie logo icon */
        .logo-icon {
            display: inline-flex;
            width: 30px;
            height: 30px;
            align-items: center;
            justify-content: center;
            margin-right: 2px;
        }

        .status {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.82rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.35s ease;
            position: relative;
        }
        /* status ring animation behind the dot */
        .status-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 38px;
            height: 38px;
            pointer-events: none;
            opacity: 0.7;
        }
        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #e74c3c;
            box-shadow: 0 0 10px #e74c3c;
            transition: all 0.4s ease;
            flex-shrink: 0;
            z-index: 1;
        }
        .dot.connected {
            background: #00e676;
            box-shadow: 0 0 14px #00e676;
            animation: dotGlow 2s infinite ease-in-out;
        }
        @keyframes dotGlow {
            0%,
            100% {
                box-shadow: 0 0 10px #00e676;
            }
            50% {
                box-shadow: 0 0 22px #00e676, 0 0 40px rgba(0, 230, 118, 0.35);
            }
        }

        /* session info row */
        .info-row {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: border-color 0.3s;
        }
        .info-row:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }
        .info-row code {
            background: rgba(0, 0, 0, 0.35);
            padding: 3px 10px;
            border-radius: 6px;
            color: #c4b5fd;
            user-select: all;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            transition: background 0.2s;
        }

        /* textarea */
        .textarea-wrapper {
            position: relative;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 280px;
            background: rgba(10, 10, 20, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 18px 20px;
            color: #f0f0f8;
            font-size: 0.95rem;
            font-family: var(--font-mono);
            line-height: 1.7;
            resize: vertical;
            outline: none;
            transition: all 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            letter-spacing: 0.01em;
        }
        textarea:focus {
            border-color: rgba(139, 124, 240, 0.5);
            box-shadow:
                0 0 0 6px rgba(139, 124, 240, 0.06),
                0 0 30px -8px var(--accent-glow),
                inset 0 0 40px rgba(139, 124, 240, 0.03);
        }

        /* buttons */
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .btn {
            padding: 11px 22px;
            border-radius: 28px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
            font-family: var(--font-sans);
            font-size: 0.84rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
            white-space: nowrap;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #7a5de8);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 6px 24px rgba(108, 92, 231, 0.3);
            font-weight: 700;
        }
        .btn-primary:hover {
            box-shadow: 0 10px 32px rgba(108, 92, 231, 0.45);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: rgba(139, 124, 240, 0.5);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
            transform: translateY(-1px);
        }
        .btn-outline.btn-sm {
            padding: 5px 14px;
            font-size: 0.74rem;
            border-radius: 20px;
        }

        /* toast */
        .toast-temp {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30, 30, 45, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.85rem;
            z-index: 99;
            pointer-events: none;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .toast-temp.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px 14px;
                border-radius: 22px;
            }
            textarea {
                height: 220px;
                font-size: 0.85rem;
            }
            .btn {
                padding: 10px 16px;
                font-size: 0.78rem;
            }
            .status {
                font-size: 0.72rem;
                padding: 6px 12px;
            }
        }
    </style>
</head>

<body>
    <!-- Lottie ambient background -->
    <div class="lottie-bg">
        <lottie-player
            src="https://assets2.lottiefiles.com/packages/lf20_evxqbxyi.json"
            background="transparent"
            speed="0.7"
            loop
            autoplay>
        </lottie-player>
    </div>

    <!-- subtle gradient orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- toast -->
    <div class="toast-temp" id="toast"></div>

    <!-- main container -->
    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="logo-icon">
                    <!-- Lottie share icon for the logo -->
                    <lottie-player
                        src="https://assets9.lottiefiles.com/packages/lf20_x8lskdsr.json"
                        background="transparent"
                        speed="1"
                        style="width: 100%; height: 100%;"
                        loop
                        autoplay>
                    </lottie-player>
                </span>
                Air<span>ForShare</span>
            </div>
            <div class="status">
                <!-- animated ring behind connection dot -->
                <div class="status-ring">
                    <lottie-player
                        id="statusRingAnimation"
                        src="https://assets8.lottiefiles.com/packages/lf20_anvnqdoe.json"
                        background="transparent"
                        speed="0.8"
                        style="width: 100%; height: 100%;"
                        loop
                        autoplay>
                    </lottie-player>
                </div>
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Connecting…</span>
            </div>
        </div>

        <div class="info-row">
            🔗 Session: <code id="sessionIdDisplay">…</code>
            <button class="btn-outline btn-sm" id="copyLinkBtn">📎 Copy link</button>
        </div>

        <div class="textarea-wrapper">
            <textarea id="sharedTextarea" placeholder="Start typing — it syncs live ✨"></textarea>
        </div>

        <div class="buttons">
            <button class="btn-outline" id="clearBtn">🗑️ Clear</button>
            <button class="btn-outline" id="copyTextBtn">📋 Copy text</button>
            <button class="btn-primary" id="newSessionBtn">🔄 New session</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        (function() {
            const toastEl = document.getElementById('toast');
            let toastTimer;

            function showToast(msg) {
                if (toastTimer) clearTimeout(toastTimer);
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
            }

            const firebaseConfig = {
                apiKey: "AIzaSyACGCVwSYv62Pyjxo7UKcgdxLq3FJVv4lA",
                authDomain: "taskflow-planner-2334d.firebaseapp.com",
                databaseURL: "https://taskflow-planner-2334d-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "taskflow-planner-2334d",
                storageBucket: "taskflow-planner-2334d.firebasestorage.app",
                messagingSenderId: "397910412033",
                appId: "1:397910412033:web:29ccabf522a9d620832900",
                measurementId: "G-CL9BS9HF51"
            };

            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            function getSessionId() {
                const params = new URLSearchParams(window.location.search);
                let sid = params.get('session');
                if (!sid) {
                    sid = generateId();
                    const url = new URL(window.location);
                    url.searchParams.set('session', sid);
                    window.history.replaceState({}, '', url);
                }
                return sid;
            }

            function generateId() {
                return Math.random().toString(36).substring(2, 10);
            }

            const SESSION_ID = getSessionId();
            document.getElementById('sessionIdDisplay').textContent = SESSION_ID;
            const shareUrl = `${window.location.origin}${window.location.pathname}?session=${SESSION_ID}`;

            const textarea = document.getElementById('sharedTextarea');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const statusRing = document.getElementById('statusRingAnimation');

            const textRef = db.ref(`sessions/${SESSION_ID}/text`);
            let isUpdatingFromFirebase = false;

            textRef.on('value', (snapshot) => {
                const text = snapshot.val() || '';
                if (!isUpdatingFromFirebase) {
                    textarea.value = text;
                }
            });

            let debounceTimer;
            textarea.addEventListener('input', () => {
                const text = textarea.value;
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    isUpdatingFromFirebase = true;
                    textRef.set(text).then(() => {
                        isUpdatingFromFirebase = false;
                    }).catch(() => {
                        isUpdatingFromFirebase = false;
                    });
                }, 200);
            });

            const connectedRef = db.ref('.info/connected');
            connectedRef.on('value', (snap) => {
                const connected = snap.val() === true;
                if (connected) {
                    statusDot.classList.add('connected');
                    statusText.textContent = 'Connected';
                    // Pause the ring animation when connected (optional)
                    statusRing.style.opacity = '0.3';
                } else {
                    statusDot.classList.remove('connected');
                    statusText.textContent = 'Disconnected';
                    statusRing.style.opacity = '0.7';
                }
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                if (confirm('Clear text for all peers?')) {
                    textRef.set('');
                    textarea.value = '';
                    showToast('✨ Text cleared for everyone');
                }
            });
            document.getElementById('copyTextBtn').addEventListener('click', () => {
                const text = textarea.value;
                if (text.trim()) {
                    navigator.clipboard.writeText(text).then(() => showToast('📋 Text copied!'));
                } else {
                    showToast('📝 Nothing to copy');
                }
            });
            document.getElementById('newSessionBtn').addEventListener('click', () => {
                const newId = generateId();
                window.location.href = `${window.location.pathname}?session=${newId}`;
            });
            document.getElementById('copyLinkBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(shareUrl).then(() => showToast('🔗 Link copied!'));
            });
        })();
    </script>
</body>
</html>
