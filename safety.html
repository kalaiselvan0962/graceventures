<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Women's Safety – SOS Alert</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #1a1a2e; color: #eee; margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; text-align: center;
  }
  h1 { font-size: 1.8rem; color: #ff4d4d; margin-bottom: .3rem; letter-spacing: 1px; }
  .subtitle { color: #aaa; margin-bottom: 1.5rem; max-width: 400px; }
  .name-row { margin-bottom: 1.5rem; }
  .name-row input {
    padding: 10px 14px; border-radius: 6px; border: 1px solid #555;
    background: #23233a; color: #eee; font-size: 1rem; width: 240px; text-align: center;
  }
  .sos-button {
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff6b6b, #cc0000);
    border: 8px solid #ffcccc; color: #fff;
    font-size: 2.2rem; font-weight: bold; letter-spacing: 2px;
    cursor: pointer; box-shadow: 0 0 30px rgba(255,0,0,.6);
    transition: transform .2s ease, box-shadow .2s ease;
    user-select: none; -webkit-tap-highlight-color: transparent;
    animation: pulse 2s infinite;
  }
  .sos-button:active { transform: scale(.95); box-shadow: 0 0 50px rgba(255,0,0,.9); }
  .sos-button:disabled { background: #555; border-color: #777; box-shadow: none; animation: none; cursor: not-allowed; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 30px rgba(255,0,0,.6); }
    50%  { box-shadow: 0 0 50px rgba(255,0,0,1); }
    100% { box-shadow: 0 0 30px rgba(255,0,0,.6); }
  }
  #status { margin-top: 30px; font-size: 1.1rem; min-height: 1.5em; color: #ffd700; }
  #map-link { margin-top: 12px; }
  #map-link a { color: #66b3ff; text-decoration: none; font-size: .95rem; }
  .contacts-info { margin-top: 40px; font-size: .85rem; color: #888; max-width: 420px; }
  .contacts-info strong { color: #ccc; }
</style>
</head>
<body>

  <h1>🆘 EMERGENCY SOS</h1>
  <p class="subtitle">Press the button to send your current location to your emergency contact.</p>

  <div class="name-row">
    <input id="nameInput" type="text" placeholder="Your name" value="SOS Alert">
  </div>

  <button id="sosBtn" class="sos-button">SOS</button>

  <div id="status"></div>
  <div id="map-link"></div>

  <div class="contacts-info">
    <p><strong>Emergency contact:</strong></p>
    <p id="contactList">risha15766@gmail.com</p>
  </div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
  (function () {
    // ============================================================
    // CONFIGURATION
    // ============================================================
    emailjs.init("WDMUJ04GltLDIkipp");      // ✅ Public Key

    const SERVICE_ID  = "service_zmpgfpf";  // ✅ Service ID
    const TEMPLATE_ID = "template_csukj0r"; // ✅ Template ID

    // ✅ Hard‑coded recipient
    const TO_EMAIL = "risha15766@gmail.com";

    // ============================================================
    // DOM
    // ============================================================
    const sosBtn    = document.getElementById("sosBtn");
    const statusEl  = document.getElementById("status");
    const mapLinkEl = document.getElementById("map-link");
    const nameInput = document.getElementById("nameInput");

    // ============================================================
    // Siren
    // ============================================================
    function playSiren() {
      try {
        const ctx  = new (window.AudioContext || window.webkitAudioContext)();
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sawtooth";
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.4);
        osc.frequency.linearRampToValueAtTime(900, now + 0.8);
        osc.frequency.linearRampToValueAtTime(600, now + 1.2);
        osc.frequency.linearRampToValueAtTime(900, now + 1.6);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 1.8);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 1.8);
        if (ctx.state === "suspended") ctx.resume();
      } catch (e) { console.warn("Siren unavailable:", e); }
    }

    // ============================================================
    // SOS click
    // ============================================================
    sosBtn.addEventListener("click", function () {
      playSiren();

      if (!navigator.geolocation) {
        statusEl.textContent = "❌ Geolocation is not supported by this browser.";
        return;
      }

      sosBtn.disabled = true;
      statusEl.textContent = "⏳ Getting your location…";
      mapLinkEl.innerHTML = "";

      navigator.geolocation.getCurrentPosition(onSuccess, onError, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    });

    // ---------- Success ----------
    async function onSuccess(position) {
      const lat = position.coords.latitude.toFixed(6);
      const lng = position.coords.longitude.toFixed(6);
      const accuracy = Math.round(position.coords.accuracy);
      const mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
      const time = new Date().toLocaleString();
      const senderName = (nameInput.value || "SOS Alert").trim();

      mapLinkEl.innerHTML =
        `<a href="${mapsUrl}" target="_blank" rel="noopener">📍 Open my location in Google Maps</a>`;

      statusEl.textContent = "📨 Sending alert…";

      // Placeholders match your template: {{name}}, {{time}}, {{message}}
      const message = [
        "🚨 EMERGENCY! I need help. This is my current location.",
        "",
        `Latitude: ${lat}`,
        `Longitude: ${lng}`,
        `Accuracy: ${accuracy} metres`,
        `Google Maps: ${mapsUrl}`,
        "",
        "Please respond immediately."
      ].join("\n");

      const templateParams = {
        to_email: TO_EMAIL,   // ✅ goes to risha15766@gmail.com
        name: senderName,
        time: time,
        message: message
      };

      try {
        await emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams);
        statusEl.textContent = `✅ Alert sent to ${TO_EMAIL}`;
      } catch (err) {
        console.error("Send failed:", err);
        statusEl.textContent = "❌ Failed to send alert. Check the console for details.";
      } finally {
        sosBtn.disabled = false;
      }
    }

    // ---------- Error ----------
    function onError(error) {
      sosBtn.disabled = false;
      switch (error.code) {
        case error.PERMISSION_DENIED:      statusEl.textContent = "❌ Location permission denied."; break;
        case error.POSITION_UNAVAILABLE:   statusEl.textContent = "❌ Location unavailable. Try again."; break;
        case error.TIMEOUT:                statusEl.textContent = "❌ Location request timed out. Try again."; break;
        default:                           statusEl.textContent = "❌ Unknown error getting your location.";
      }
    }
  })();
  </script>
</body>
</html>
