<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#0f9d58">
<title>Live Dashboard</title>
<style>
  /* ---------- Reset ---------- */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    overscroll-behavior: none;      /* stop pull-to-refresh interference */
    -webkit-text-size-adjust: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;             /* handles mobile browser bars */
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #0f9d58;
    color: #fff;
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top));
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    z-index: 10;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 15px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    opacity: .95;
    white-space: nowrap;
  }
  .status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #b6f0cd;
    box-shadow: 0 0 0 0 rgba(182,240,205,.7);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(182,240,205,.7); }
    70%  { box-shadow: 0 0 0 8px rgba(182,240,205,0); }
    100% { box-shadow: 0 0 0 0 rgba(182,240,205,0); }
  }

  button {
    background: rgba(255,255,255,.22);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    min-height: 44px;               /* Apple/Google tap target */
    min-width: 44px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s;
    flex-shrink: 0;
  }
  button:active { background: rgba(255,255,255,.45); }
  button.spinning svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Frame container ---------- */
  main {
    flex: 1;
    position: relative;
    display: flex;
    min-height: 0;
    background: #fff;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    flex: 1;
    background: #fff;
  }

  /* ---------- Loading overlay ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #f4f5f7;
    z-index: 5;
    transition: opacity .35s ease;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 42px; height: 42px;
    border: 4px solid #e0e0e0;
    border-top-color: #0f9d58;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  .overlay p { color: #555; font-size: 14px; line-height: 1.5; }
  .overlay .error-title { color: #d93025; font-weight: 700; font-size: 15px; }

  /* ---------- Small phones ---------- */
  @media (max-width: 400px) {
    header { padding: 6px 10px; padding-top: calc(6px + env(safe-area-inset-top)); }
    header h1 { font-size: 13.5px; }
    .status { display: none; }      /* free up space */
    button { padding: 10px; }
    button .label { display: none; } /* icon-only button on tiny screens */
  }

  /* ---------- Landscape phones ---------- */
  @media (max-height: 500px) and (orientation: landscape) {
    header { padding: 4px 12px; padding-top: calc(4px + env(safe-area-inset-top)); }
    header h1 { font-size: 12.5px; }
  }
</style>
</head>
<body>

<header>
  <h1>📊 Live Dashboard</h1>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Connecting…</span>
  </div>
  <button id="refreshBtn" aria-label="Refresh dashboard">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </svg>
    <span class="label">&nbsp;Refresh</span>
  </button>
</header>

<main>
  <iframe
    id="sheetFrame"
    title="Live Excel Dashboard"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
  </iframe>

  <div class="overlay" id="overlay">
    <div class="spinner"></div>
    <p>Loading dashboard…</p>
  </div>
</main>

<script>
/* ============================================================
   ⚙️  CONFIG
   ============================================================ */
const SHEET_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOXCSntuakA0H1UiZNA8HcrrLNZZbl_tUX7cVz2EjHyvu8_8h9-N3IakDOkLwanA/pubhtml?widget=true&headers=false";

const REFRESH_INTERVAL_MS = 30000;   // 30 s — the fastest useful value
                                     // (Google caches published view ~1 min)
/* ============================================================ */

const iframe    = document.getElementById('sheetFrame');
const overlay   = document.getElementById('overlay');
const statusEl  = document.getElementById('statusText');
const dot       = document.getElementById('dot');
const refreshBtn = document.getElementById('refreshBtn');

let lastUpdated = null;
let refreshTimer = null;

/* ---------- Load / reload iframe with cache-buster ---------- */
function loadSheet() {
  overlay.classList.remove('hidden');
  overlay.innerHTML = `<div class="spinner"></div><p>Refreshing…</p>`;

  const sep = SHEET_URL.includes('?') ? '&' : '?';
  iframe.src = SHEET_URL + sep + '_t=' + Date.now();   // forces a fresh request
  lastUpdated = Date.now();
  setStatus('Updating…');
}

/* ---------- Status text ---------- */
function setStatus(text) { statusEl.textContent = text; }

function updateStatusText() {
  if (!lastUpdated) return;
  const s = Math.floor((Date.now() - lastUpdated) / 1000);
  if (s < 10)       setStatus('Just updated');
  else if (s < 60)  setStatus(`Updated ${s}s ago`);
  else              setStatus(`Updated ${Math.floor(s/60)}m ago`);
}

/* ---------- iframe events ---------- */
iframe.addEventListener('load', () => {
  overlay.classList.add('hidden');
  updateStatusText();
});

/* ---------- Manual refresh ---------- */
refreshBtn.addEventListener('click', () => {
  refreshBtn.classList.add('spinning');
  loadSheet();
  setTimeout(() => refreshBtn.classList.remove('spinning'), 900);
});

/* ---------- Auto-refresh ---------- */
function startAuto() {
  stopAuto();
  refreshTimer = setInterval(loadSheet, REFRESH_INTERVAL_MS);
}
function stopAuto() {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

/* Pause when the tab/screen is hidden — saves battery & data */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopAuto();
    dot.style.animation = 'none';
  } else {
    loadSheet();
    startAuto();
    dot.style.animation = '';
  }
});

/* Live "Xs ago" counter */
setInterval(updateStatusText, 1000);

/* ---------- Boot ---------- */
loadSheet();
startAuto();
</script>

</body>
</html>
